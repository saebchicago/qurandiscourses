# CLEAN URLS. Every page has exactly one address: /read, not
# /read.html. Netlify already serves an extensionless path from the
# matching .html file, so these rules only retire the old address.
# force = true is required: without it a redirect never fires for a
# path that matches a real file, and /read.html is a real file.
# Netlify carries the query string across a redirect whose target has
# none, so /read.html?s=34&a=1 lands on /read?s=34&a=1 intact.
#
# The 200-serving path is the clean one, which is why every page's CSP
# block above is mirrored onto it: Netlify matches headers against the
# REQUEST path, so a clean path with no block of its own would ship
# with no Content-Security-Policy at all. The .html blocks are kept as
# insurance in case a rule below is ever removed.
#
# Generated share pages under /s/ keep their .html addresses: they are
# noindex bounce stubs, excluded from sitemap.xml, and their URLs are
# already in the wild from the share button.

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

