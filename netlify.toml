# Netlify configuration: headers and clean-URL redirects (no build step;
# deploy = push).
#
# STRUCTURE NOTE — read before editing. When several [[headers]] rules
# match one path, Netlify emits every matching rule's values; browsers
# then enforce ALL received Content-Security-Policy headers as their
# intersection, and X-Frame-Options cannot be relaxed per-path at all.
# So: the always-safe headers live on /*, while the CSP is declared
# exactly once per ADDRESS below (never on /*), which is what lets
# embed.html alone carry frame-ancestors * while every other page keeps
# frame-ancestors 'none' (X-Frame-Options is deliberately absent - CSP
# frame-ancestors supersedes it in every browser that supports CSP2).
# THIS IS FAIL-OPEN FOR NEW PAGES: a page without its own block ships
# with no CSP. scripts/check-headers-sync.mjs enforces one block per
# page - run it after adding any page or touching this file.
#
# Each page has TWO blocks with identical values, one per address: the
# clean path it is served at (/read) and the .html path that redirects
# to it (/read.html). Netlify matches headers against the request path,
# so the clean path needs its own block or it ships bare; the .html
# block stays as insurance in case its redirect is ever removed. Both
# are generated from the same file by scripts/build-csp.mjs. index.html
# already followed this shape with "/" and "/index.html".
#
# SCRIPT-SRC AND STYLE-SRC-ELEM ARE GENERATED. script-src carries no
# 'unsafe-inline'; each page's inline <script> blocks are authorized by
# SHA-256 hash. style-src-elem 'self' (+ hashes for inline <style> blocks)
# governs <style> elements and stylesheet links on modern browsers, so
# injected <style>/foreign CSS are blocked; inline `style=` attributes
# (incl. dynamically computed ones) fall back to style-src, which keeps
# 'unsafe-inline'. All hashes below are written by scripts/build-csp.mjs -
# DO NOT hand-edit them. After adding/editing/removing any inline <script>
# or <style>, rerun `node scripts/build-csp.mjs`; `--check` fails the
# build if they drift.

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# The LLM-facing site maps (llmstxt.org convention), generated by
# scripts/build-llms.mjs. Plain text with an explicit charset: the full
# file carries Arabic and transliteration diacritics.
# The versioned data archive (scripts/build-datapack.mjs).
[[headers]]
  for = "/data/exports/*.tar.gz"
  [headers.values]
    Content-Type = "application/gzip"

# Browser search-engine registration (see /search).
[[headers]]
  for = "/opensearch.xml"
  [headers.values]
    Content-Type = "application/opensearchdescription+xml"

# The changelog Atom feed, generated by scripts/build-changelog.mjs.
[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# The service worker script itself must never be cached by the browser's
# HTTP cache (only by the SW machinery's own update check) - "no-cache"
# forces a revalidation on every request so an SW_VERSION bump is picked
# up promptly. No CSP block: not an HTML page, script-src 'self' already
# covers registering it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/javascript"

# No CSP block: not an HTML page.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Static assets and bundled data. Netlify's default is
# "public, max-age=0, must-revalidate", and no asset URL here is
# fingerprinted, so every navigation issued a conditional request per
# file - up to 26 of them on /read.
# sw.js's stale-while-revalidate hides that from repeat visitors, but not
# from the first few navigations of a session and not at all from a
# browser where the service worker fails to register.
#
# Deliberately a short TTL, not "immutable": without content hashes in
# the filenames, a long max-age would serve stale JS against fresh HTML
# after a deploy. Five minutes covers a reading session while keeping
# deploy propagation effectively immediate. must-revalidate on top so a
# stale entry is never served once it expires.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# There is no [build] section, so the publish root is the repo root and
# everything in it is served, docs/ and scripts/ included. The code being
# public is intended (GPL, public repo); the internal planning and review
# memos under docs/ being CRAWLABLE is not - robots.txt is Allow: / and
# nothing else marks them. Serve them, do not index them.
[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Always-safe security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Entity share pages (s/root|theme|surah/*, generated by
# scripts/build-share-pages.mjs) - same strict CSP as the site.
[[headers]]
  for = "/s/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.alquran.cloud; media-src 'self' https://cdn.islamic.network; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

# The one deliberate exception: embed.html may be iframed anywhere.
# Everything else in its CSP stays as strict as the site's.
[[headers]]
  for = "/embed.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.alquran.cloud; media-src 'self' https://cdn.islamic.network; object-src 'none'; base-uri 'self'; frame-ancestors *; form-action 'self'; upgrade-insecure-requests"

# Per-page CSP: the site-wide policy, declared once per page.
# The root path and index.html are both listed - Netlify matches the
# literal request path.

[[headers]]
  for = "/embed"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.alquran.cloud; media-src 'self' https://cdn.islamic.network; object-src 'none'; base-uri 'self'; frame-ancestors *; form-action 'self'; upgrade-insecure-requests"

