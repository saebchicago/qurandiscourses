# Netlify configuration: headers only (no build step; deploy = push).
#
# STRUCTURE NOTE — read before editing. When several [[headers]] rules
# match one path, Netlify emits every matching rule's values; browsers
# then enforce ALL received Content-Security-Policy headers as their
# intersection, and X-Frame-Options cannot be relaxed per-path at all.
# So: the always-safe headers live on /*, while the CSP is declared
# exactly once per page below (never on /*), which is what lets
# embed.html alone carry frame-ancestors * while every other page keeps
# frame-ancestors 'none' (X-Frame-Options is deliberately absent - CSP
# frame-ancestors supersedes it in every browser that supports CSP2).
# THIS IS FAIL-OPEN FOR NEW PAGES: a page without its own block ships
# with no CSP. scripts/check-headers-sync.mjs enforces one block per
# page - run it after adding any page or touching this file.
#
# SCRIPT-SRC AND STYLE-SRC-ELEM ARE GENERATED. script-src carries no
# 'unsafe-inline'; each page's inline <script> blocks are authorized by
# SHA-256 hash. style-src-elem 'self' (+ hashes for inline <style> blocks)
# governs <style> elements and stylesheet links on modern browsers, so
# injected <style>/foreign CSS are blocked; inline `style=` attributes
# (incl. dynamically computed ones) fall back to style-src, which keeps
# 'unsafe-inline'. All hashes below are written by scripts/build-csp.mjs -
# DO NOT hand-edit them. After adding/editing/removing any inline <script>
# or <style>, rerun `node scripts/build-csp.mjs`; `--check` fails the
# build if they drift.

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# The service worker script itself must never be cached by the browser's
# HTTP cache (only by the SW machinery's own update check) - "no-cache"
# forces a revalidation on every request so an SW_VERSION bump is picked
# up promptly. No CSP block: not an HTML page, script-src 'self' already
# covers registering it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/javascript"

# No CSP block: not an HTML page.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Always-safe security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Entity share pages (s/root|theme|surah/*, generated by
# scripts/build-share-pages.mjs) - same strict CSP as the site.
[[headers]]
  for = "/s/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.alquran.cloud; media-src 'self' https://cdn.islamic.network; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

# The one deliberate exception: embed.html may be iframed anywhere.
# Everything else in its CSP stays as strict as the site's.
[[headers]]
  for = "/embed.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.alquran.cloud; media-src 'self' https://cdn.islamic.network; object-src 'none'; base-uri 'self'; frame-ancestors *; form-action 'self'; upgrade-insecure-requests"

# Per-page CSP: the site-wide policy, declared once per page.
# The root path and index.html are both listed - Netlify matches the
# literal request path.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-+UFhXny3gk/ReouifZ/sNyUKXZmIiGYjAiBqNpQpBDg=' 'sha256-OFqwrEm4kzfjn2rBjdzgsWKNYqnRFvifzuqXrHYbieE=' 'sha256-byRK4KdtrXGhCqRmPlVvuFhrbhDrZl+cTvhoCzgte4g=' 'sha256-/NO2aHlfHsXSUK6+nExrSaqOX6Uwo+Z313IjQ/KshCI='; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.alquran.cloud; media-src 'self' https://cdn.islamic.network; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

