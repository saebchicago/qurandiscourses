name: Fetch word timings (quran-align)

# Runs scripts/build-word-timings.mjs where the network is open: it
# downloads quran-align's word timings, tests each candidate reciter
# against data/recitation/durations.json, and commits the report (and
# the timings of reciters that pass) back to the working branch. It
# never commits to main; the result goes through review in its PR.

on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/build-word-timings.mjs
      - .github/workflows/word-timings.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: word-timings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Fetch and test word timings against the measured durations
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Fetch and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-word-timings.mjs

      - name: Commit to the working branch
        run: |
          git add -A data/recitation/
          if git diff --cached --quiet; then
            echo "Word timings unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fetch word timings (quran-align) from the audio headers" \
            -m "Generated by .github/workflows/word-timings.yml running scripts/build-word-timings.mjs."
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
