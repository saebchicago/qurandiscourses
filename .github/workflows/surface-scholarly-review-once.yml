name: Surface scholarly review pathway once

on:
  push:
    branches: [enhance/discovery-scholarly-review-clean-20260825]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: enhance/discovery-scholarly-review-clean-20260825
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update page and deterministic derivatives
        run: node scripts/surface-scholarly-review-once.mjs
      - name: Commit generated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Surface scholarly review pathway"
          git push origin HEAD:enhance/discovery-scholarly-review-clean-20260825
