name: Bundle Qur'an text

# Runs scripts/build-quran-text.mjs where the network is open. Some
# development environments cannot reach api.alquran.cloud or tanzil.net,
# so the text is fetched and verified here instead.
#
# - On a working branch (a push that changes the generator or this file,
#   or a manual run): build, and commit data/quran-text/ back to that
#   branch when it changed. The commit then goes through review in its PR.
# - On main (monthly, or a manual run): never commits. It only checks the
#   bundled text still matches upstream and fails loudly if it drifted,
#   so a change to the Qur'an text never lands without a person reading it.

on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/build-quran-text.mjs
      - .github/workflows/quran-text.yml
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quran-text-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fetch, verify, and bundle the Arabic text
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Check against upstream (main)
        if: github.ref == 'refs/heads/main'
        run: node scripts/build-quran-text.mjs --check

      - name: Build (working branch)
        if: github.ref != 'refs/heads/main'
        run: node scripts/build-quran-text.mjs

      - name: Commit to the working branch
        if: github.ref != 'refs/heads/main'
        run: |
          git add data/quran-text
          if git diff --cached --quiet; then
            echo "data/quran-text/ unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bundle the Arabic text (Tanzil Uthmani, verified verse for verse)" \
            -m "Generated by .github/workflows/quran-text.yml running scripts/build-quran-text.mjs."
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
