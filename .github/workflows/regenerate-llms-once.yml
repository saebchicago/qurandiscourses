name: Regenerate LLM discovery files once

on:
  push:
    branches: [enhance/discovery-scholarly-review-20260825]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: enhance/discovery-scholarly-review-20260825
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate discovery artifacts and remove this one-shot workflow
        run: |
          node scripts/build-llms.mjs
          rm .github/workflows/regenerate-llms-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms.txt llms-full.txt .github/workflows/regenerate-llms-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate LLM discovery artifacts"
          git push origin HEAD:enhance/discovery-scholarly-review-20260825
