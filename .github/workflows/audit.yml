name: Site audit

on:
  push:
    branches: [main]
    paths-ignore:
      # Docs and GitHub metadata never change served pages.
      # Workflow edits still run: this file is not ignored.
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  schedule:
    # Citation and translation endpoints can drift without a code change.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Content, security, and browser integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate claims and site registries
        run: |
          node scripts/check-claims.mjs
          node scripts/check-videos.mjs
          node scripts/check-exercises.mjs
          node scripts/check-data-nums.mjs
          node scripts/check-paths.mjs
          node scripts/check-lenses.mjs
          node scripts/check-names.mjs
          node scripts/check-notice.mjs
          node scripts/check-contrib.mjs
          node scripts/check-ask.mjs
          node scripts/check-root-datasets.mjs
          node scripts/check-exports-sync.mjs
          node scripts/check-safe-key.mjs
          node scripts/validate-evidence.mjs

      - name: Validate navigation and deployment headers
        run: |
          node scripts/check-nav-sync.mjs
          node scripts/check-docs-sync.mjs
          node scripts/check-headers-sync.mjs
          node scripts/build-csp.mjs --check
          node scripts/build-sw-manifest.mjs --check
          node scripts/check-sw-version.mjs

      - name: Validate citation metadata
        # One version everywhere: version.json vs CITATION.cff vs the
        # about.html example vs the generated bib/version.js pair.
        run: |
          node scripts/check-citation.mjs
          node scripts/build-citations.mjs --check
          node scripts/build-glossary.mjs --check

      - name: Validate generated URLs and static fallbacks
        # Run every deterministic check before paying the browser setup cost.
        # This catches stale generated artifacts in seconds without downloading
        # or installing Playwright/Chromium first.
        run: |
          node scripts/build-canonicals.mjs --check
          node scripts/build-static-fallbacks.mjs --check
          node scripts/build-page-toc.mjs --check
          node scripts/build-jsonld.mjs --check
          node scripts/build-llms.mjs --check
          node scripts/build-changelog.mjs --check
          node scripts/build-datapack.mjs --check
          node scripts/build-search-index.mjs --check
          node scripts/build-ask-routes.mjs --check
          node scripts/build-related.mjs --check
          node scripts/build-path-data.mjs --check
          node scripts/build-name-mentions.mjs --check
          node scripts/build-ribbons.mjs --check
          node scripts/build-provenance.mjs --check
          node scripts/compute-coverage.mjs --check
          node scripts/check-generated-freshness.mjs

      - name: Install browser audit harness
        # PRs get the full browser gate. Scheduled/manual runs recheck the
        # deployed experience. A post-merge push repeats deterministic checks
        # only, avoiding a second Chromium download for the same reviewed change.
        if: github.event_name != 'push'
        run: |
          npm install --global playwright@1.54.1
          playwright install --with-deps chromium

      - name: Run end-to-end browser audit
        if: github.event_name != 'push'
        run: |
          # setup-node's exact install path can vary across runner images.
          export QD_PLAYWRIGHT="$(npm root --global)/playwright/index.mjs"
          node scripts/verify-site.mjs

  external-evidence:
    name: External citation and edition health
    # Also runs on pull_request, but NEVER blocks one: these checks call
    # third-party endpoints, so a merge must not wait on someone else's
    # downtime. continue-on-error keeps the job advisory while still
    # surfacing rot on the PR that introduces it. The scheduled run stays
    # the hard signal.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check citation links
        run: node scripts/check-source-links.mjs --timeout 20000

      - name: Check the juz endpoint whole-juz reading depends on
        if: ${{ !cancelled() }}
        run: node scripts/check-juz-endpoint.mjs

      - name: Check translation edition identities
        if: ${{ !cancelled() }}
        run: node scripts/check-editions.mjs

      - name: Check the word-by-word translator credit
        if: ${{ !cancelled() }}
        run: node scripts/check-wbw-credit.mjs
