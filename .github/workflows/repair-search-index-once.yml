name: Regenerate search index once

on:
  push:
    branches: [fix/build-usage-architecture-20260825]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/build-usage-architecture-20260825
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate committed search index and remove this one-shot workflow
        run: |
          node scripts/build-search-index.mjs
          rm .github/workflows/repair-search-index-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search-index.json .github/workflows/repair-search-index-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate search index after source correction [skip ci]"
          git push origin HEAD:fix/build-usage-architecture-20260825
