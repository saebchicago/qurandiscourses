name: Measure recitation durations

# Runs scripts/build-recitation-durations.mjs where the network is open:
# it reads each verse's duration from the header of the audio file /read
# plays (cdn.islamic.network), for every reciter /read offers, and commits
# data/recitation/durations.json back to the working branch. It never
# commits to main; the result goes through review in its PR.

on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/build-recitation-durations.mjs
      - .github/workflows/recitation-durations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recitation-durations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure verse durations from the audio headers
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Measure
        run: node scripts/build-recitation-durations.mjs

      - name: Commit to the working branch
        run: |
          git add data/recitation/durations.json
          if git diff --cached --quiet; then
            echo "data/recitation/durations.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Measure recitation durations from the audio headers" \
            -m "Generated by .github/workflows/recitation-durations.yml running scripts/build-recitation-durations.mjs."
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
