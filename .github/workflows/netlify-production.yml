name: Netlify production deploy

# Netlify's native Git integration is the primary production path.
# Keep this workflow as a manual, build-free fallback only so every
# merge does not spend GitHub Actions minutes and trigger a second deploy.
on:
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Deploy checked-in static site to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: d6653a12-56ff-4c32-b511-46efe0cfea7b
        run: >-
          npx --yes netlify-cli@latest deploy
          --prod
          --dir .
          --site "$NETLIFY_SITE_ID"
          --auth "$NETLIFY_AUTH_TOKEN"
