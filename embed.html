<!doctype html>
<html lang="en" dir="ltr" data-depth="simple">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Embed · Divine Discourses</title>
    <meta
      name="description"
      content="Embeddable Divine Discourses components: a root profile, a theme card, or a verse."
    />
    <!-- The ONE page allowed inside foreign iframes: netlify.toml gives
         /embed.html frame-ancestors * (every other page stays 'none').
         No nav, no settings, no share button - just the requested card.
         ?type=root|theme|verse&id=... is whitelisted against the bundled
         datasets in assets/embed.js per maintainer-guide §5. -->
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="assets/style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="%232b1d0e"/><text x="32" y="46" text-anchor="middle" font-family="Amiri,serif" font-size="42" fill="%23f6efe2">ق</text></svg>'
    />
  </head>
  <body class="embed-body">
    <main id="embedRoot" class="embed-card" aria-live="polite">
      <p class="embed-loading">Loading…</p>
    </main>
    <script src="assets/surahs.js"></script>
    <script src="assets/app.js"></script>
    <script src="assets/root-meanings.js"></script>
    <script src="assets/embed.js" defer></script>
  </body>
</html>
